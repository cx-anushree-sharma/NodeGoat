name: Fuzz
on: [push, pull_request]

permissions:
  contents: read

jobs:
  fuzz:
    name: validate_config.py (atheris)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout https://github.com/${{ github.repository }}@${{ github.ref }}
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: "3.13"

      - name: Install fuzzing dependencies
        run: pip install -r fuzz/requirements.txt

      - name: Fuzz validate_config.py for 60s
        run: python fuzz/fuzz_validate_config.py -max_total_time=60
